---
Managed: false
StepByStep: false
IdleKeepState: false

StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"

StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"

VerboseStateFactory: true

constraints:
- type: contact
- type: dynamics
  damper: [0.1, 0.01, 0.5]
- type: compoundJoint

collisions:
- type: collision
  useMinimal: true

# Pass configuration to the custom Idle C++ state
configs:

  Idle:
    duration: 3.0

  Independent:
    LeftTarget:
      position: [0.50, 0.10, 0.10] # x, y, z
      orientation: [-1.57079632679, 0.0, 0.0] # roll, pitch, yaw

    RightTarget:
      position: [0.50, 0.40, 0.10]
      orientation: [1.57079632679, 0.0, 0.0]

    Trajectory:
      duration: 6.0
      outwardAmplitude: 0.12

  Collaborative:
    Impedance:
      Stiffness: [30.0, 30.0, 30.0,70.0, 70.0, 70.0] # rot, tras
      DampingRatio: 1.0
      Inertia: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
    
    RelativeImpedance:
      Stiffness: [30.0, 30.0, 30.0,50.0, 50.0, 50.0]
      DampingRatio: 1.0
    
    SqueezeControl:
      Reference: -10.0
    
    StiffnessEstimation:
      test1: 1.0






# The exported C++ states are referenced directly.
# There is no need to redefine them under states:.

transitions:
- [Idle, OK, Independent, Auto]
#- [Independent, OK, Collaborative, Auto]
#- [Collaborative, OK, Idle, Auto]

init: Idle

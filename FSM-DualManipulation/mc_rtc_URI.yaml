# mc_rtc FRAMEWORK SETTINGS
# ============================================================
MainRobot: xArm7




robots:
  xarm7_2:
    module: "xArm7"
    init_pos:
      translation: [0.0, 0.66, 0.0]
      rotation: [0.0, 0.0, 0.0]


Robots:
  xarm7:
    module: "xArm7"  
    interface: interface_template
    robot_interface:
      driver: RobotDriverxArm
      ip: 192.168.1.211
      port: 0
      autostart: true
      
  xarm7_2:
    base: xarm7              
    robot_interface:             
      ip: 192.168.1.244
      

# Enable only the new FSM controller
Enabled: FSMDualManipulation

Timestep: 0.001

# Plugins
Plugins: [ROS2]



# Logging
LogDirectory: "/home/vscode/workspace/sandbox/controllers/FSM-DualManipulation/Logs"
LogTemplate: "URI-"



